<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant Waiters</title>

    <link rel="stylesheet" href="../static/Kaiadmin/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/Kaiadmin/assets/css/plugins.min.css">
    <link rel="stylesheet" href="../static/Kaiadmin/assets/css/kaiadmin.min.css">
    <link rel="stylesheet" href="../static/Kaiadmin/assets/css/fonts.min.css">
    <script src="app.js" defer></script>
</head>

<body>

    <header>
        <h1>RESTAURANT WAITERS</h1>
    </header>

    <main>

        <h2>Add New Waiter</h2>

        <form id="waiter-form">

            <label for="waiter_name">Waiter Name:</label>
            <input
                type="text"
                id="waiter_name"
                name="waiter_name"
                maxlength="20"
                placeholder="Enter waiter name"
                required
            >

            <label for="birth_year">Date of Birth:</label>
            <input
                type="date"
                id="birth_year"
                name="birth_year"
                required
            >

            <label for="shift">Shift:</label>
            <select id="shift" name="shift" required>
                <option value="">Select Shift</option>
                <option value="morning">Morning</option>
                <option value="day">Day</option>
                <option value="evening">Evening</option>
            </select>

            <label for="contact">Contact:</label>
            <input
                type="tel"
                id="contact"
                name="contact"
                maxlength="20"
                placeholder="Enter contact number"
                required
            >

            <label for="address">Address:</label>
            <input
                type="text"
                id="address"
                name="address"
                maxlength="20"
                placeholder="Enter address"
                required
            >

            <label for="number_of_tables_assigned">Number of Tables Assigned:</label>
            <input
                type="number"
                id="number_of_tables_assigned"
                name="number_of_tables_assigned"
                min="0"
                placeholder="Enter number of tables assigned"
            >

            <button type="submit">Save Waiter</button>
            <button type="reset">Clear</button>

        </form>

        <h2>Waiter Records</h2>

        <div class="table-responsive">
        <table class="table table-head-bg-primary table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th>Waiter ID</th>
                    <th>Waiter Name</th>
                    <th>Date of Birth</th>
                    <th>Shift</th>
                    <th>Contact</th>
                    <th>Address</th>
                    <th>Number of Tables Assigned</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="waiter-list">
                <!-- Waiter records will appear here -->
            </tbody>
        </table>
        </div>

    </main>

</body>
</html>
